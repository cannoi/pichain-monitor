services:
  app:
    image: ghcr.io/cannoi/pichain-monitor:latest
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      - PORT=8080
      - COLLECTOR_ENABLED=1
      - HORIZON_ALLOW_PRIVATE=0
    volumes:
      - ./data:/app/data
