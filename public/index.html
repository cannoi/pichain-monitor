<!DOCTYPE html>
<html lang="en" x-data="piMonitor()" x-init="init()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiChain Monitor — Pi Network Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="/vendor/alpine.min.js"></script>
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/pi-indicators.js"></script>
  <script src="/pi-chart.js"></script>
  <link rel="stylesheet" href="/ai-panel.css">
  <style>
    .paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}
    [x-cloak]{display:none!important}
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-amber-500/20">π</div>
        <div>
          <h1 class="font-bold text-lg text-amber-400 tracking-wide">PiChain Monitor</h1>
          <p class="text-xs text-slate-400" x-text="t('subtitle')"></p>
        </div>
      </div>
      <div class="flex items-center space-x-2 sm:space-x-3 flex-wrap">
        <div class="bg-slate-800 p-1 rounded-xl flex text-xs">
          <button @click="setLang('en')" :class="lang==='en' ? 'bg-amber-500 text-slate-950 font-semibold' : 'text-slate-300'" class="px-2.5 py-1 rounded-lg transition">EN</button>
          <button @click="setLang('vi')" :class="lang==='vi' ? 'bg-amber-500 text-slate-950 font-semibold' : 'text-slate-300'" class="px-2.5 py-1 rounded-lg transition">VI</button>
        </div>
        <div class="bg-slate-800 p-1 rounded-xl flex text-xs">
          <button @click="setMode(true)" :class="simpleMode ? 'bg-emerald-500 text-slate-950 font-semibold' : 'text-slate-300'" class="px-2.5 py-1 rounded-lg" x-text="t('modeSimple')"></button>
          <button @click="setMode(false)" :class="!simpleMode ? 'bg-emerald-500 text-slate-950 font-semibold' : 'text-slate-300'" class="px-2.5 py-1 rounded-lg" x-text="t('modePro')"></button>
        </div>
        <div class="bg-slate-800 p-1 rounded-xl flex">
          <button @click="setNetwork('mainnet')" :class="network==='mainnet' ? 'bg-amber-500 text-slate-950 font-semibold shadow' : 'text-slate-300 hover:text-white'" class="px-3 py-1.5 rounded-lg text-xs transition">Mainnet</button>
          <button @click="setNetwork('testnet')" :class="network==='testnet' ? 'bg-amber-500 text-slate-950 font-semibold shadow' : 'text-slate-300 hover:text-white'" class="px-3 py-1.5 rounded-lg text-xs transition">Testnet</button>
        </div>
        <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl border" role="status" aria-live="polite"
             :class="liveState==='live' ? 'bg-emerald-500/10 border-emerald-500/40' : (liveState==='wait' ? 'bg-amber-500/10 border-amber-500/40' : 'bg-red-500/10 border-red-500/40')"
             :title="liveTitle()">
          <span class="w-2.5 h-2.5 rounded-full shrink-0"
                :class="liveState==='live' ? 'bg-emerald-400 animate-pulse' : (liveState==='wait' ? 'bg-amber-400 animate-pulse' : 'bg-red-500')"></span>
          <span class="text-[11px] font-medium"
                :class="liveState==='live' ? 'text-emerald-300' : (liveState==='wait' ? 'text-amber-300' : 'text-red-300')"
                x-text="liveState==='live' ? t('liveOn') : (liveState==='wait' ? t('liveWait') : t('liveOff'))"></span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 flex-1 w-full space-y-4">
    <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl px-4 py-3 text-sm text-amber-100/90" x-show="simpleMode">
      <span x-text="t('easyTip')"></span>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3">
      <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-3 sm:p-4 shadow-sm">
        <p class="text-xs text-slate-400" x-text="t('blockHeight')"></p>
        <p class="text-2xl font-bold text-amber-400 mt-1" x-text="fmtMeta(stats.height)"></p>
        <p class="text-[10px] text-emerald-400 mt-1" x-text="t('liveUpdate')"></p>
      </div>
      <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 shadow-sm">
        <p class="text-xs text-slate-400" x-text="t('protocol')"></p>
        <p class="text-2xl font-bold text-amber-400 mt-1" x-text="fmtMeta(stats.protocol)"></p>
        <p class="text-[10px] text-slate-400 mt-1" x-text="stats.networkPassphrase || 'Pi Network'"></p>
      </div>
      <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 shadow-sm">
        <p class="text-xs text-slate-400" x-text="t('capacity')"></p>
        <p class="text-2xl font-bold text-amber-400 mt-1" x-text="fmtMeta(stats.capacity)"></p>
        <p class="text-[10px] text-slate-400 mt-1" x-text="t('ledgerUsage')"></p>
      </div>
      <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 shadow-sm">
        <p class="text-xs text-slate-400" x-text="t('avgFee')"></p>
        <p class="text-2xl font-bold text-amber-400 mt-1" x-text="fmtMeta(stats.avgFee)"></p>
        <p class="text-[10px] text-slate-400 mt-1" x-text="t('baseFee')"></p>
      </div>
    </div>

    <div class="text-[11px] text-slate-500 flex items-center gap-2 flex-wrap px-0.5">
      <span class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-800 px-2 py-1 rounded-lg max-w-full">
        <span class="w-1.5 h-1.5 rounded-full shrink-0" :class="liveState==='live' ? 'bg-emerald-400' : (liveState==='wait' ? 'bg-amber-400' : 'bg-red-400')"></span>
        <span class="truncate" x-text="liveState==='live' ? t('dataOk') : (liveState==='wait' ? t('liveWait') : t('dataBad'))"></span>
      </span>
      <span class="text-slate-600 truncate" x-show="stats.consensusReason" x-text="stats.consensusReason"></span>
    </div>

    <!-- Sources & capability (P1) -->
    <details class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-xs" x-show="!simpleMode">
      <summary class="cursor-pointer text-slate-300 font-medium" x-text="t('sourcesTitle')"></summary>
      <div class="mt-3 space-y-2 text-slate-400">
        <p x-text="t('sourcesHint')"></p>
        <p class="font-mono text-[10px]" x-text="'Horizon: '+(sources.horizon?.mainnet||'')+' | '+(sources.horizon?.testnet||'')"></p>
        <p x-show="sources.collector">Collector: <span x-text="sources.collector?.lastRun ? 'last '+sources.collector.lastRun : '—'"></span>
          <span x-show="sources.collector?.lastError" class="text-red-400" x-text="' err: '+sources.collector.lastError"></span>
        </p>
        <div class="grid grid-cols-2 gap-2" x-show="sources.capabilities">
          <template x-for="net in ['mainnet','testnet']" :key="net">
            <div class="bg-slate-950 rounded-lg p-2">
              <p class="text-amber-400 font-medium" x-text="net"></p>
              <template x-if="sources.capabilities?.[net]?.endpoints">
                <div class="flex flex-wrap gap-1 mt-1">
                  <template x-for="(ep, key) in sources.capabilities[net].endpoints" :key="key">
                    <span class="px-1 rounded" :class="ep.ok ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-500'" x-text="key"></span>
                  </template>
                </div>
              </template>
              <p class="text-slate-600 mt-1" x-show="!sources.capabilities?.[net]" x-text="t('notProbed')"></p>
            </div>
          </template>
        </div>
        <p class="text-slate-500" x-show="snapshotNote" x-text="snapshotNote"></p>
      </div>
    </details>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-slate-200" x-text="t('activityChart')"></h2>
        <span class="text-xs text-slate-400" x-text="trendSummary"></span>
      </div>
      <div class="h-48 relative"><canvas id="activityChart"></canvas></div>
    </div>


    <!-- Multi-asset / DEX observation (richer on Testnet) -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4" x-show="!simpleMode">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg>
          <span x-text="t('assetsTitle')"></span>
        </h2>
        <span class="text-[10px] text-slate-400" x-text="t('viewOnly')"></span>
      </div>
      <p class="text-[11px] text-amber-400/90" x-show="network==='testnet'" x-text="t('testnetNote')"></p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <p class="text-xs text-slate-400 mb-2" x-text="t('topAssets')"></p>
          <div class="space-y-1.5 max-h-48 overflow-y-auto">
            <template x-for="a in assets" :key="(a.code||'')+(a.issuer||'')">
              <div class="bg-slate-950 border border-slate-800/60 px-2.5 py-1.5 rounded-lg flex justify-between text-xs gap-2">
                <span class="font-mono text-amber-300 truncate" x-text="a.code"></span>
                <span class="text-slate-400 whitespace-nowrap" x-text="holderLabel(a)"></span>
              </div>
            </template>
            <template x-if="!assets.length"><p class="text-[11px] text-slate-500" x-text="t('noAssets')"></p></template>
          </div>
        </div>
        <div>
          <p class="text-xs text-slate-400 mb-2" x-text="t('recentTrades')"></p>
          <div class="space-y-1.5 max-h-48 overflow-y-auto">
            <p class="text-[10px] text-slate-500 mb-1.5" x-text="t('tapTrade')"></p>
            <template x-for="tr in trades" :key="tr.id">
              <button type="button" class="w-full text-left bg-slate-950 border border-slate-800/60 hover:border-amber-500/50 px-2.5 py-1.5 rounded-lg text-xs transition"
                      @click="openTradePair(tr)">
                <div class="flex justify-between gap-2">
                  <span class="font-mono text-amber-300" x-text="tr.pair"></span>
                  <span class="text-slate-400" x-text="tr.time"></span>
                </div>
                <p class="text-[10px] text-slate-500 mt-0.5" x-text="(tr.baseAmount||'')+' → '+(tr.counterAmount||'')+(tr.price?' · '+tr.price:'')"></p>
              </button>
            </template>
            <template x-if="!trades.length"><p class="text-[11px] text-slate-500" x-text="t('noTrades')"></p></template>
          </div>
        </div>
        <div>
          <p class="text-xs text-slate-400 mb-2" x-text="t('pools')"></p>
          <div class="space-y-1.5 max-h-48 overflow-y-auto">
            <template x-for="pl in pools" :key="pl.id">
              <div class="bg-slate-950 border border-slate-800/60 px-2.5 py-1.5 rounded-lg text-xs">
                <span class="text-amber-300 font-mono" x-text="(pl.reserves||[]).map(r=>r.code).join('/')"></span>
                <p class="text-[10px] text-slate-500 mt-0.5" x-text="(pl.reserves||[]).map(r=>Number(r.amount).toFixed(2)+' '+r.code).join(' · ')"></p>
              </div>
            </template>
            <template x-if="!pools.length"><p class="text-[11px] text-slate-500" x-text="t('noPools')"></p></template>
          </div>
        </div>
      </div>

      <!-- Pair chart: any pair, any timeframe, candles/line/area, volume, indicators -->
      <div class="mt-4 border-t border-slate-800 pt-4" id="pairPanel">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
          <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v3m0 10v3M7 7h0m0 10h0M7 7v10M17 3v4m0 10v4M17 7v10M5 7h4v10H5zM15 7h4v10h-4z"/></svg>
            <span x-text="t('pairChart')"></span>
          </h3>
          <span class="text-[11px] font-mono text-amber-300" x-text="selectedPairLabel"></span>
        </div>
        <!-- Stock-style: pick pair from live list (no issuer typing) -->
        <div class="flex flex-col sm:flex-row gap-2 mb-3">
          <div class="flex-1 min-w-0">
            <label class="text-[10px] text-slate-500 block mb-1" x-text="t('pickPair')"></label>
            <select class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono text-amber-300"
                    x-model="pickedPairKey" @change="openPickedPair()">
              <option value="" x-text="t('pickPairPh')"></option>
              <template x-for="ap in availablePairs" :key="ap.key">
                <option :value="ap.key" x-text="ap.label + (ap.lastPrice ? (' · '+ap.lastPrice) : '')"></option>
              </template>
            </select>
            <p class="text-[10px] text-slate-500 mt-1" x-show="!availablePairs.length" x-text="t('noPairsAvail')"></p>
          </div>
          <div class="flex sm:items-end gap-2">
            <button type="button" class="flex-1 sm:flex-none bg-amber-500 text-slate-950 font-semibold rounded-xl px-4 py-2.5 text-sm" @click="openPickedPair()" x-text="t('openChart')"></button>
          </div>
        </div>
        <p class="text-[11px] text-slate-500 mb-2" x-text="t('pairsHint')"></p>

        <div x-show="selectedPairLabel" x-cloak>
          <!-- Default: candles + standard TF strip -->
          <div class="flex gap-1 overflow-x-auto pb-1 -mx-1 px-1" role="tablist" :aria-label="t('timeframe')">
            <template x-for="f in tfList" :key="f.id">
              <button type="button" role="tab" class="shrink-0 text-[11px] px-2.5 py-1 rounded-lg border"
                      :class="pairTf===f.id ? 'bg-amber-500 text-slate-950 border-amber-500 font-semibold' : 'bg-slate-950 text-slate-300 border-slate-700'"
                      @click="setTf(f.id)" x-text="f.label"></button>
            </template>
          </div>
          <!-- Always-on essentials -->
          <div class="flex flex-wrap items-center gap-1.5 mt-2 text-[11px]">
            <span class="px-2 py-1 rounded-lg bg-amber-500/15 border border-amber-500/40 text-amber-200" x-text="'🕯 '+t('tCandles')"></span>
            <span class="px-2 py-1 rounded-lg border" :class="pairVol ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-300' : 'bg-slate-950 border-slate-700 text-slate-400'" x-text="'▥ '+t('volume')"></span>
            <span class="px-2 py-1 rounded-lg bg-slate-800/80 text-slate-300" x-show="pairInd.sma">SMA20</span>
            <button type="button" class="px-2 py-1 rounded-lg border bg-slate-950 border-slate-700 text-slate-300" @click="showChartTools=!showChartTools" x-text="showChartTools ? t('hideTools') : t('moreTools')"></button>
            <span class="ml-auto flex gap-1.5">
              <button type="button" class="bg-emerald-600/80 text-white px-2 py-1 rounded-lg" @click="analyzePairTa(selectedBase, selectedCounter)" x-text="t('taBtn')"></button>
              <button type="button" class="bg-slate-800 text-slate-300 px-2 py-1 rounded-lg" @click="clearSelectedPair()" x-text="t('close')"></button>
            </span>
          </div>
          <!-- Optional tools (collapsed by default) -->
          <div class="flex flex-wrap items-center gap-1.5 mt-2 text-[11px] p-2 bg-slate-950/80 border border-slate-800 rounded-xl" x-show="showChartTools" x-cloak>
            <select x-model="pairType" @change="chartOptsChanged()" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1" :aria-label="t('chartType')">
              <option value="candles" x-text="'🕯 '+t('tCandles')"></option>
              <option value="hollow" x-text="'▯ '+t('tHollow')"></option>
              <option value="ohlc" x-text="'┣ '+t('tOhlc')"></option>
              <option value="heikin" x-text="'◈ '+t('tHeikin')"></option>
              <option value="line" x-text="'📈 '+t('tLine')"></option>
              <option value="area" x-text="'◿ '+t('tArea')"></option>
            </select>
            <button type="button" class="px-2 py-1 rounded-lg border" :class="pairVol ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-300' : 'bg-slate-950 border-slate-700 text-slate-300'" @click="pairVol=!pairVol; chartOptsChanged()">▥ <span x-text="t('volume')"></span></button>
            <div class="relative">
              <button type="button" class="px-2 py-1 rounded-lg border bg-slate-950 border-slate-700 text-slate-200" @click="indMenu=!indMenu" :aria-expanded="indMenu">ƒx <span x-text="t('indicators')"></span><span class="text-amber-400" x-show="indCount()>0" x-text="' ('+indCount()+')'"></span></button>
              <div class="absolute z-30 mt-1 left-0 w-60 max-w-[80vw] bg-slate-900 border border-slate-700 rounded-xl p-3 shadow-xl space-y-1" x-show="indMenu" @click.outside="indMenu=false" x-cloak>
                <p class="text-[10px] uppercase text-slate-500" x-text="t('indOverlay')"></p>
                <template x-for="k in indOverlay" :key="k.id">
                  <label class="flex items-center gap-2 py-0.5"><input type="checkbox" :checked="pairInd[k.id]" @change="toggleInd(k.id)"><span class="inline-block w-2 h-2 rounded-full" :style="'background:'+k.color"></span><span x-text="k.label"></span></label>
                </template>
                <p class="text-[10px] uppercase text-slate-500 pt-1" x-text="t('indPane')"></p>
                <template x-for="k in indPane" :key="k.id">
                  <label class="flex items-center gap-2 py-0.5"><input type="checkbox" :checked="pairInd[k.id]" @change="toggleInd(k.id)"><span class="inline-block w-2 h-2 rounded-full" :style="'background:'+k.color"></span><span x-text="k.label"></span></label>
                </template>
                <p class="text-[10px] text-slate-500 pt-1" x-text="t('indNote')"></p>
              </div>
            </div>
            <button type="button" class="px-2 py-1 rounded-lg border bg-slate-950 border-slate-700 text-slate-300" @click="chartReset()" :title="t('resetView')">⟲</button>
            <button type="button" class="px-2 py-1 rounded-lg border bg-slate-950 border-slate-700 text-slate-300" @click="chartPng()" :title="t('savePng')">⬇ PNG</button>
            <button type="button" class="px-2 py-1 rounded-lg border bg-slate-950 border-slate-700 text-slate-300" @click="loadCandles(true)" :title="t('refresh')">↻</button>
          </div>
          <p class="text-[11px] text-slate-500 mt-2" x-text="t('pairChartNote')"></p>
          <p class="text-[11px] text-red-400 mt-1" x-show="pairCandleError" x-text="pairCandleError"></p>
          <div class="relative mt-2 bg-slate-950 rounded-xl border border-slate-800 overflow-hidden" :style="'height:'+proHeight()+'px'">
            <div id="proChart" class="absolute inset-0"></div>
            <div class="absolute inset-0 flex items-center justify-center text-[11px] text-slate-400 pointer-events-none" x-show="pairLoading" x-text="t('loading')"></div>
          </div>
          <p class="text-[10px] text-slate-500 mt-1" x-show="pairCandleMeta" :title="t('chartMetaTip')"
             x-text="pairCandleMeta ? ('ⓘ '+pairCandleMeta.count+' · '+pairTf+(pairCandleMeta.derivedFrom ? ' ('+t('derivedFrom')+' '+pairCandleMeta.derivedFrom+')' : '')+' · '+t('updated')+' '+pairCandleMeta.time+' · '+t('gapNote')) : ''"></p>
          <div class="grid grid-cols-2 gap-2 text-[11px] mt-2" x-show="pairDetail && pairDetail.spread">
            <p x-show="pairDetail.spread?.mid != null" x-text="'Mid ~ '+Number(pairDetail.spread.mid).toPrecision(6)"></p>
            <p x-show="pairDetail.spread?.spreadBps != null" x-text="'Spread '+Number(pairDetail.spread.spreadBps).toFixed(1)+' bps'"></p>
          </div>
        <template x-if="pairTa && pairTa.analysis">
          <div class="mt-2 p-3 bg-slate-950 border border-emerald-500/25 rounded-xl text-xs space-y-1">
            <p class="text-emerald-300 font-medium" x-text="t('taTitle')"></p>
            <p x-show="pairTa.analysis.note==='insufficient_history'" class="text-slate-500" x-text="t('taNeedMore')"></p>
            <div class="grid grid-cols-2 gap-1" x-show="pairTa.analysis.sampleSize">
              <span x-text="t('taLast')+': '+fmtNum(pairTa.analysis.lastClose)"></span>
              <span :class="(pairTa.analysis.changePct||0)>=0?'text-emerald-400':'text-red-400'" x-text="t('taChange')+': '+(pairTa.analysis.changePct!=null?pairTa.analysis.changePct.toFixed(2)+'%':'—')"></span>
              <span x-text="'SMA7 '+fmtNum(pairTa.analysis.sma7)"></span>
              <span x-text="'RSI '+ (pairTa.analysis.rsi14!=null?pairTa.analysis.rsi14.toFixed(1):'—')"></span>
              <span class="col-span-2" x-text="t('taTrend')+': '+trendLabel(pairTa.analysis.trend)"></span>
            </div>
          </div>
        </template>
        </div>
      </div>
    </div>


    <!-- One-tap observe (P4) — works without AI API key -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
      <h2 class="text-sm font-semibold text-slate-200 mb-2" x-text="t('observeTitle')"></h2>
      <p class="text-[11px] text-slate-500 mb-2" x-text="t('observeHint')"></p>
      <div class="flex gap-2 flex-wrap">
        <input type="text" x-model="observeQ" :placeholder="t('observePh')" class="flex-1 min-w-[180px] bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">

          this.selectedBase = b; this.selectedCounter = c; this.selectedBaseIssuer = bi; this.selectedCounterIssuer = ci;
          this.selectedPairLabel = b + ' / ' + c; this.pairTa = null; this.pairDetailError = null;
          this.loadPair(b, c, bi, ci);
        },
        // ---- market chart (canvas, local engine) ----
        proHeight(){ return 300 + 74 * ['rsi','macd','stoch'].filter(k => this.pairInd[k]).length; },
        indCount(){ return Object.keys(this.pairInd).filter(k => this.pairInd[k]).length; },
        savePrefs(){ try { localStorage.setItem('pichain_chart', JSON.stringify({ tf: this.pairTf, type: this.pairType, vol: this.pairVol, ind: this.pairInd })); } catch(e) {} },
        setTf(id){ this.pairTf = id; this.savePrefs(); this.loadCandles(false); },
        toggleInd(k){ this.pairInd[k] = !this.pairInd[k]; this.chartOptsChanged(); },
        chartOptsChanged(){
          this.savePrefs();
          this.$nextTick(() => { if (window.__proChart) { window.__proChart.setOptions({ type: this.pairType, volume: this.pairVol, ind: { ...this.pairInd } }); window.__proChart.resize(); } });
        },
        chartReset(){ if (window.__proChart) window.__proChart.resetView(); },
        chartPng(){
          if (!window.__proChart) return;
          const a = document.createElement('a'); a.href = window.__proChart.toDataURL();
          a.download = 'pichain-' + (this.selectedPairLabel || 'pair').replace(/[^A-Za-z0-9]+/g, '-') + '-' + this.pairTf + '.png'; a.click();
        },
        loadCandles(silent){
          if (!this.selectedBase) return;
          const q = new URLSearchParams({ network: this.network, base: this.selectedBase, counter: this.selectedCounter || 'PI', tf: this.pairTf, limit: '300' });
          if (this.selectedBaseIssuer) q.set('base_issuer', this.selectedBaseIssuer);
          if (this.selectedCounterIssuer) q.set('counter_issuer', this.selectedCounterIssuer);
          const key = [this.network, this.selectedBase, this.selectedBaseIssuer, this.selectedCounter, this.selectedCounterIssuer, this.pairTf].join('|');
          const seq = ++this._cSeq; const sameView = silent && key === this._candleKey;
          if (!silent) { this.pairLoading = true; this.pairCandleError = null; }
          fetch('/api/v2/pair/candles?' + q).then(async r => {
            const d = await this.safeJson(r);
            if (seq !== this._cSeq) return;
            this.pairLoading = false;
            if (!r.ok || d.ok === false) { if (!silent) { this.pairCandleError = d.error || 'error'; this._candles = []; this.drawPro(false, key); } return; }
            this._candles = d.candles || []; this._tfMs = d.tfMs || this._tfMs;
            this.pairCandleError = this._candles.length ? null : ((this.lang === 'vi' ? d.note_vi : d.note) || d.note || this.t('noChartData'));
            this.pairCandleMeta = this._candles.length ? { count: d.candles.length, derivedFrom: d.derivedFrom || null, time: new Date().toLocaleTimeString() } : null;
            this.drawPro(sameView, key);
          }).catch(e => { if (seq !== this._cSeq) return; this.pairLoading = false; if (!silent) this.pairCandleError = e.message; });
        },
        drawPro(keepView, key){
          this._candleKey = key;
          this.$nextTick(() => {
            const el = document.getElementById('proChart');
            if (!el || !window.PiChart) return;
            if (!window.__proChart || window.__proChartEl !== el) {
              if (window.__proChart) { try { window.__proChart.destroy(); } catch(e) {} }
              window.__proChart = window.PiChart.create(el); window.__proChartEl = el;
            }
            window.__proChart.setOptions({ type: this.pairType, volume: this.pairVol, ind: { ...this.pairInd } });
            window.__proChart.setData(this._candles, this._tfMs, !!keepView);
          });
        },
        runAnalyze(type){
          this.analyzeResult = null;
          const body = { type, network: this.network };
          if (type === 'wallet' && this.walletResult?.address) body.address = this.walletResult.address;
          fetch('/api/v2/analyze', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
            .then(r => r.json()).then(d => { this.analyzeResult = d; })
            .catch(e => { this.analyzeResult = { ok:false, error: e.message }; });
        },
        removeReport(id){ fetch('/api/reports/'+id,{method:'DELETE'}).then(()=>{ this.activeReport=null; this.fetchReports(); }); },
        showReport(rp){ this.activeReport = rp; },
        setMode(simple){ this.simpleMode = !!simple; localStorage.setItem('pichain_simple', simple ? '1' : '0'); },
        exportAnalyze(){
          if (!this.analyzeResult) return;
          const blob = new Blob([JSON.stringify(this.analyzeResult, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'pichain-analyze-'+Date.now()+'.json';
          a.click();
        },
        fetchAlerts(){
          fetch('/api/v2/alerts/rules').then(r=>r.json()).then(d=>this.alertRules=Array.isArray(d)?d:[]).catch(()=>{});
          fetch('/api/v2/alerts/events').then(r=>r.json()).then(d=>this.alertEvents=Array.isArray(d)?d:[]).catch(()=>{});
        },
        addAlertRule(kind){
          fetch('/api/v2/alerts/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,network:this.network,name:kind,params:{threshold:0.8}})})
            .then(()=>this.fetchAlerts());
        },
        removeAlertRule(id){ fetch('/api/v2/alerts/rules/'+id,{method:'DELETE'}).then(()=>this.fetchAlerts()); },
        candleH(c){
          const v = Number(c.c || c.close || c.h || 0);
          if (!v) return 8;
          return Math.min(100, Math.max(8, (Math.log10(v + 1) / 3) * 100));
        },
        fetchDashboards(){ fetch('/api/v2/dashboards').then(r=>r.json()).then(d=>this.dashboards=Array.isArray(d)?d:[]).catch(()=>{}); },
        saveDashboard(){
          const widgets = Object.keys(this.dashSel).filter(k => this.dashSel[k]);
          if (!widgets.length) return;
          fetch('/api/v2/dashboards', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: 'Board '+new Date().toISOString().slice(0,16), widgets }) })
            .then(() => this.fetchDashboards());
        },
        removeDashboard(id){ fetch('/api/v2/dashboards/'+id,{method:'DELETE'}).then(()=>this.fetchDashboards()); },
        loadDashboard(d){ this.activeDash = d; this.simpleMode = false; },
        addWalletAlert(){
          if (!this.walletResult?.address) return;
          fetch('/api/v2/alerts/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
            kind:'wallet_balance_change', network:this.network, name:'wallet-delta',
            params:{ address: this.walletResult.address, minDelta: 0 }
          })}).then(()=>this.fetchAlerts());
        },
        exportObserveMd(){
          if (!this.observeResult?.reply_markdown) return;
          const blob = new Blob([this.observeResult.reply_markdown], { type: 'text/markdown' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'pichain-observe-'+Date.now()+'.md';
          a.click();
        },
        startSse(){
          try {
            if (this._es) this._es.close();
            this.sseOk = null;
            const es = new EventSource('/api/v2/stream?network='+this.network);
            this._es = es;
            es.onmessage = (ev) => {
              try {
                const d = JSON.parse(ev.data);
                this.sseOk = !d.error; this._sseLast = Date.now();
                if (d.height != null && this.stats) {
                  // only update height meta if object shape
                  if (this.stats.height && typeof this.stats.height === 'object') {
                    this.stats.height = { ...this.stats.height, value: d.height, display: String(d.height), fetchedAt: d.fetchedAt };
                  }
                }
              } catch(e) { this.sseOk = false; }
            };
            es.onerror = () => { this.sseOk = false; };
            es.onopen = () => { if (this.sseOk !== true) this.sseOk = null; };
          } catch(e) { this.sseOk = false; }
        },

        runObserve(){
          const q = (this.observeQ || '').trim();
          if (!q) return;
          this.observeResult = null;
          fetch('/api/v2/observe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: q, network: this.network, lang: this.lang, address: this.walletResult?.address })
          }).then(r => r.json()).then(d => { this.observeResult = d; })
            .catch(e => { this.observeResult = { reply_markdown: e.message, evidence: [] }; });
        },


        statusDotClass(){
          const s = this.stats.consensusStatus || this.stats.networkStatus?.status;
          if (s === 'ok') return 'bg-emerald-400';
          if (s === 'slow' || s === 'busy') return 'bg-amber-400';
          if (s === 'stalled' || s === 'degraded') return 'bg-red-400';
          return 'bg-slate-500';
        },
        fetchSources(){
          fetch('/api/v2/sources').then(r=>r.json()).then(d=>{ this.sources = d || {}; }).catch(()=>{});
          fetch('/api/v2/snapshots?network='+this.network+'&limit=48').then(r=>r.json()).then(d=>{
            if (d.from) this.snapshotNote = (this.lang==='vi'?'Dữ liệu snapshot từ ':'Snapshots from ')+d.from;
            else this.snapshotNote = this.lang==='vi'?'Chưa có snapshot (collector đang thu)':'No snapshots yet (collector warming up)';
          }).catch(()=>{});
        }
      };
    }
    // Global helper so AI panel / other scripts can save a report
    window.__pichainSaveReport = async function(title, question, answer, network){
      try {
        await fetch('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,question,answer,network:network||'mainnet'})});
      } catch(e) {}
    };
  </script>
  <script src="/ai-module/ai-module.js"></script>
  <script src="/feedback-module/feedback-module.js"></script>
  <script src="/ai-panel.js"></script>
  <img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost">
